<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>

<!-- Raiz del documento, el atributo lang="es" especifica que el idioma principal es español-->
<html lang="es">

<!--Encabezado el usuario no lo puede visualizar-->
<head>
    <!-- Codificacion de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptacion a pantallas moviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titulo de la pestana -->
    <title>Imagenes en HTML-Madrid De la Cruz Valeria Dayana - No.0862</title>
</head> <!--Cierre de encabezado-->

<!-- Abrir el cuerpo del documento -->
<body>

<!-- Subtitulo principal de la seccion -->
<h2>Imagenes en HTML</h2>

<!-- Subtitulo para imagenes locales -->
<h3>Locales</h3>
<!-- Carga una imagen local con texto por sino carga -->
<img src="caritas.png" alt="Imagen de carita feliz">

<!-- Subtitulo para imagenes "locales redimensionadas" -->
<h3>Locales redimensionado</h3>
<!-- Carga una imagen desde una carpeta especificando ancho y alto -->
<img src="imagenes/carita.png" alt="Carita feliz local" width="200" height="100">

<!-- Subtitulo para imagenes desde una URL externa -->
<h3>Desde internet</h3>
<!-- Carga una imagen directamente usando un enlace de internet -->
<img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" width="200" height="200" alt="Carita feliz de internet">

<!-- Subtitulo para imagenes animadas -->
<h3>Animaciones</h3>
<!-- Carga una imagen animada (GIF) desde un enlace externo -->
<img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" width="200" height="200" alt="Animacion GIF">

</body> <!-- Cierre del cuerpo del documento -->
</html> <!-- Cierre definitivo del documento HTML -->
