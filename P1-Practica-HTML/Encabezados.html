<!-- Tipo de documento HTML5 -->
<!DOCTYPE html>

<!-- Raiz del documento, el atributo lang="es" especifica que el idioma principal es español-->
<html lang="es">

<!--Encabezado el usuario no lo puede visualizar-->
<head>
    <!-- Codificacion de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptacion a pantallas moviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titulo de la pestana -->
    <title>Encabezados HTML-Madrid De la Cruz Valeria Dayana - No.0862</title>
</head> <!--Cierre de encabezado-->

<!-- Abrir del cuerpo del documento -->
<body>
   
    <!-- "H1" El título principal de mayor jerarquía. Solo debe haber uno por página para el tema central -->
    <h1>Titulo 1</h1>
    
    <!-- "H2" Subtítulo principal para dividir secciones importantes del contenido -->
    <h2>Titulo 2</h2>
    
    <!-- "H3" Subsección dependiente de un H2 -->
    <h3>Titulo 3</h3>
    
    <!-- "H4" Subsección secundaria menos relevante o de nivel más profundo -->
    <h4>Titulo 4</h4>
    
    <!-- "H5" Encabezado de nivel 5, bastante pequeño -->
    <h5>Titulo 5</h5>
    
    <!-- "H6" El encabezado de menor tamaño y menor importancia jerárquica en HTML -->
    <h6>Titulo 6</h6>
    
</body> <!-- Cierre del cuerpo del documento -->
</html> <!-- Cierre definitivo del documento HTML -->
