<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML Ejemplo_Basico</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>

<h2>Formularios con checkbox</h2>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
Selecciona los lenguajes que conozcas:
<br>
<!--Define una casilla cuadrada que el usuario puede marcar (activar) o desmarcar con un clic 
y a diferencia del de las opciones multiples en este puedes seleccionar varios al mismo tiempo-->
<input type="checkbox" name="Java">Java <br>
<input type="checkbox" name="Python"> Python <br>
<input type="checkbox" name="C#">C# <br>
<input type="checkbox" name="Flutter"> Flutter <br>
</form>

</body>
</html>
