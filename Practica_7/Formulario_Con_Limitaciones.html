<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML Ejemplo_Basico</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body>

<!--Subtitulo "h2"-->
<h2>Formulario con limitaciones</h2>
<!--Indica que es un formulario e action indica a donde enviarlo en este caso esta vacio para enviarlo a la misma pagina y post es la manera en que se va a enviar-->
<form action="" method="post">
Ingresa tu nombre:
<!--disabled deshabilita la casilla para que no se pueda escribir ni enviar el dato al servidor-->
<input type="text" name="nombre" disabled><br>
Contraseña:
<!--maxlength indica el limite maximo de caracteres que deja escribir en el campo-->
<input type="password" name="pass" maxlength="5"><br>
Comentarios:
<!--readonly deja el campo en solo lectura es decir que se puede ver pero el usuario no lo puede modificar ni borrar-->
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>
<!--Cierra el formulario-->
</form>

</body>
</html>
