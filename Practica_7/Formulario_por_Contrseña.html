<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML Ejemplo_Basico</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>

<!--Subtitulo "h2"-->
<h2>Formulario para contraseñas</h2>
<form action="" method="post">
Ingresa tu usuario:
<input type="text" name="usuario">
Ingresa tu contraseña:
<input type="password" name="pass">
<br>

<!--Indica que el botón es de reinicio es decir al presionarlo reinicia todo a como estaba antes -->
<input type="submit" value="enviar">
<input type="reset" value="borrar">
</form>

</body>
</html>
