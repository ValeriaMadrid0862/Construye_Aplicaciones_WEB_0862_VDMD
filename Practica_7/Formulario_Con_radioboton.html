<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML Ejemplo_Basico</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body>

<!--Subtitulo "h2"-->
<h2>Formularios con Radioboton</h2>
<!--Indica que es un formulario e action indica a donde enviarlo en este caso esta vacio para enviarlo a la misma pagina y post es la manera en que se va a enviar-->
<form action="" method="post">
Ingresa tu nombre:
<!--Indica que tipo de dato es texto y name es el nombre del dato que se le manda al servidor-->
<input type="text" name="nombre">
<br>
Selecciona el maximo de estudios que tienes:
<br>
<!--type=radio indica que es un circulo de opcion multiple name=estudios indica que pertenecen al mismo grupo para que solo se pueda escoger uno y value es el dato que se manda al servidor-->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<!--Indica que el control es un boton funcional de envio submit es la funcion de enviar los datos cargados al servidor-->
<input type="submit" value="enviar">
<!--Indica que el boton es de reinicio es decir al presionarlo borra los datos y lo regresa a como estaba antes-->
<input type="reset" value="borrar">
<!--Cierra el formulario-->
</form>

</body>
</html>
